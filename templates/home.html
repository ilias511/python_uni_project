{% extends 'base.html' %}
{% block content %}
<h2>New Thought</h2>
<form method="post">{% csrf_token %}
{{ form.as_p }}
<button>Post</button>
</form>

<h2>All Thoughts</h2>
{% for post in posts %}
<div class="post">
<p>{{ post.content }}</p>
<small>{{ post.author }} | {{ post.created_at }}</small>
{% if post.author == user %}
<a href="/edit/{{ post.id }}/">Edit</a>
<a href="/delete/{{ post.id }}/" onclick="return confirmDelete()">Delete</a>
{% endif %}
</div>
{% endfor %}
{% endblock %}
